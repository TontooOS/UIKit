[package]
name = "uikit"
version = "26.1.0"
edition = "2021"
license = "MIT"
description = "native Rust UI toolkit for TontooOS with a UIKit-Dynamics-style animation engine"
readme = "README.md"
keywords = ["tontoo", "ui", "gtk4", "compositor", "animation"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
uikitdynamics = { path = "/Library/System/uikitdynamics" }
bitflags = "2"
glow = "0.16"
libloading = "0.8"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
